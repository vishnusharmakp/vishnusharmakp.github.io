name: Update fraud and data news

# Refreshes data/news.json from public Google News RSS feeds.
# Schedule is 12:30 UTC daily. GitHub may delay scheduled runs.
# workflow_dispatch lets the owner run it from the Actions tab.

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fraud-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch headlines
        run: python3 scripts/update_news.py

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No news changes."
          else
            git commit -m "Update fraud and data news"
            git push
          fi
